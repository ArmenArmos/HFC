    return testsCard+`<section class="card" style="background:var(--teal-l);border-color:#B9DEDB">${`<div style="display:flex;gap:12px"><span style="flex:none;color:var(--teal-d)">${ic('lock',22)}</span><div><h2 class="h2">Why you do not see numbers yet</h2><p style="margin-top:4px">${sum} She shares the results <b>together with your plan</b>, so each number comes with a clear explanation from a doctor, not a guess. If anything urgent is found, your care team contacts you straight away.</p></div></div>`}</section>`+reps+questionsCard();
  }
  if(!S.tests.length) return testsCard+`<section class="card"><h2 class="h2">Results</h2><p class="muted" style="margin-top:4px">No tests were ordered on this route, so there are no new results. Reports you added are listed here and are not interpreted by Noreon.</p></section>`+reps;
  const firstPlan=(S.planHistory[0]||S.plan); const testDates=S.tests.map(id=>S.book[id]&&S.book[id].date).filter(Boolean).sort((a,b)=>a-b);
  const rows=availableLabRows(firstPlan.at);
  const out=rows.filter(l=>l.v>l.hi||l.v<l.lo).length;
  const pct=(v,a,b)=>Math.max(0,Math.min(100,(v-a)/(b-a)*100));
  return `<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 class="h2">Blood and urine tests</h2><span class="muted sm">${testDates.length?dShort(testDates[0])+(testDates.length>1&&sod(testDates[0])!==sod(testDates[testDates.length-1])?' to '+dShort(testDates[testDates.length-1]):''):''} · released with plan v1, ${dShort(firstPlan.at)}</span></div><p style="margin-top:8px">${out} of ${rows.length} values are outside the lab's range. Only available demo values received by this release are shown; missing tests remain unknown.</p><div class="muted sm" style="display:flex;gap:10px;align-items:center;margin-top:10px">${avatar('doc',32)}<span>Explained by Dr. Ani Petrosyan on ${dNum(firstPlan.at)} with plan v1.${S.plan.v>1?' Later plan versions did not replace this explanation.':''}</span></div></section>`+
  `<section class="card" aria-label="Test values">${rows.map((l,i)=>{ const o=l.v>l.hi||l.v<l.lo; return `<div style="padding:12px 0;${i?'border-top:1px solid var(--line2)':''}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${l.name}</b><span class="disp nr" style="font-weight:700;font-size:16px">${l.v} <span class="muted" style="font:500 13px Inter,system-ui,sans-serif">${l.u}</span></span></div><div aria-hidden="true" style="position:relative;height:10px;margin:12px 0 8px;border-radius:5px;background:var(--line2)"><div style="position:absolute;top:0;bottom:0;left:${pct(l.lo,l.min,l.max)}%;width:${pct(l.hi,l.min,l.max)-pct(l.lo,l.min,l.max)}%;background:var(--teal-l);border-left:2px solid var(--teal);border-right:2px solid var(--teal)"></div><div style="position:absolute;top:-4px;left:${pct(l.v,l.min,l.max)}%;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid #fff;background:${o?'var(--amber)':'var(--ink)'}"></div></div><div class="muted xs" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Lab range ${l.lo===0?'under '+l.hi:l.lo+' to '+l.hi} ${l.u}</span>${o?statChip('above',true):`<span class="chip s c-ok">${STAT.ok.dot}In range</span>`}</div>${l.note?`<p class="muted sm" style="margin-top:6px">${l.note}</p>`:''}${o?`<button class="link" data-a="ask" data-v="Explain my ${l.name} result" data-l="Explain my ${l.name}" style="padding:0">Ask Zoe to explain ›</button>`:''}</div>`; }).join('')}</section>`+reps+questionsCard();
}
function questionsCard(){

}

/* ============ Care plan ============ */

  if(!S.plan) return prePlanScreen();
  const p=S.plan, m=planMed(), recs=p.recs;
  const seen=S.planSeen;
  const head=`<div><h1 class="h1">My care plan</h1><p class="muted" style="margin-top:4px">What Dr. Ani has recommended for you</p></div>`;
  const approved=`<section class="card p18" aria-label="Plan summary"><div class="chip c-ok" style="font-size:13px">${ic('shield',14,2.2)}Approved by your doctor · version ${p.v}</div><h2 class="disp" style="margin:10px 0 4px;font-size:21px;line-height:1.25;font-weight:800">${h(p.goal)}</h2><p class="muted sm">Published ${dNum(p.at)} ${new Date(p.at).getFullYear()}, ${hm(p.at)} by ${p.doctor}, family medicine. Zoe explains this plan. Only Dr. Ani can change it.</p>
   ${p.v>1?`<div class="callout co-indigo" style="margin-top:12px"><span style="flex:none;margin-top:2px">${ic('refresh',18,2)}</span><div><b>What changed:</b> ${h(p.change)}</div></div>`:''}
   ${!seen?`<div style="margin-top:12px">${btn('I have read my plan','planSeen',{k:'btn-navy',full:true})}</div>`:''}
   ${(()=>{ const wk=Math.max(1,Math.ceil((dayDiff(S.now,S.plan.at)+1)/7)); const tot=S.plan.kind==='maint'?26:12; const done=wk>tot||ge('m6'); return `<div style="display:flex;justify-content:space-between;font-size:13.5px;margin:14px 0 6px" class="muted nr"><span>${done?'Programme complete':'Week '+Math.min(wk,tot)+' of '+tot}</span><span>${S.reviewDue?'Next review '+dShort(S.reviewDue):''}</span></div><div class="bar"><i style="width:${Math.min(100,wk/tot*100)}%"></i></div>`; })()}</section>`;
  const explain=`<section class="card" aria-label="In plain words"><h2 class="h2">In plain words</h2><p style="margin-top:6px">${p.kind==='maint'?'Your blood pressure is now where we want it. That is the result of your effort. We keep it there with a lighter routine: your tablet every morning, and measuring on 3 days each month.':'Your blood pressure is higher than it should be. If it stays high for years it strains the heart, brain and kidneys. Your plan has three parts: a daily tablet, small changes to salt and walking, and a 7-day blood pressure check every few weeks, so Dr. Ani can see whether it works.'}</p><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${cbtn('Explain it even simpler','ask','Explain my plan simply','pri')}</div><p class="xs muted" style="margin-top:10px">Prototype wording. Thresholds follow ESC guidance (2024 ESC hypertension guideline, ESC/ESH home method). The clinical lead signs them off before live use.</p></section>`;
  const meds=`<section class="card" aria-label="Medicines"><h2 class="h2">Medicines</h2><div style="display:flex;gap:14px;align-items:center;margin-top:12px"><span style="flex:none;width:44px;height:44px;border-radius:14px;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center">${ic('pill',22)}</span><div style="flex:1;min-width:0"><b>${m.name} ${m.dose}</b><div class="muted">${m.how}, reminder ${effectiveMedReminder()}</div><div style="font-size:14px;color:var(--teal-d);font-weight:600">${medEffective(m)}</div></div></div>
   <details class="dd" style="margin-top:10px"><summary>If I forget a dose ${ic('right',18,2,'class="chev"')}</summary><div class="dd-b muted"><div class="callout co-amber" style="margin-bottom:8px"><span style="flex:none">${ic('info',16,2)}</span><div class="xs"><b>Sample wording for this prototype. Not an approved instruction.</b> The clinical lead supplies the real text before any live use.</div></div>${m.missed}<div class="xs" style="margin-top:6px">Zoe does not give missed-dose advice. For a missed or doubled dose, ask Narine or your pharmacist.</div><div style="margin-top:8px">${cbtn('Ask the nurse to call me','esc','nurse|Missed dose question|Question about a missed dose|same')}</div></div></details>
   <details class="dd"><summary>If I feel unwell after taking it ${ic('right',18,2,'class="chev"')}</summary><div class="dd-b muted">Do not stop or change anything yourself. Tell Zoe or call the nurse. For ${URG_SYMP}, call 103.</div></details>
   ${callout('teal','shield','<b>Zoe can remind and explain. Zoe cannot start, stop or change a medicine.</b> Only Dr. Ani can.')}</section>`;
  const bpGuide=`<section class="card" aria-label="Blood pressure measurement"><h2 class="h2">Blood pressure at home</h2>
   <div class="kv"><span>When</span><span>${S.plan.kind==='maint'?'3 days each month':'7 days in a row, every '+p.intervalWeeks+' weeks'}</span></div><div class="kv"><span>How often</span><span>2 morning + 2 evening</span></div><div class="kv"><span>Next check</span><span>${S.nextBlock?dShort(S.nextBlock.start):IDX[S.stage]>=IDX.m6?'None. Programme complete':'Zoe tells you'}</span></div><div class="kv"><span>Home line</span><span>Average under 135/85 mmHg</span></div><div class="kv"><span>Clinic aim</span><span>Set by Dr. Ani. ESC 2024: 120 to 129 over 70 to 79 if well tolerated</span></div>
   <details class="dd"><summary>How to measure ${ic('right',18,2,'class="chev"')}</summary><div class="dd-b">${bpSteps()}</div></details></section>`;
  const habits=`<section class="card" aria-label="Daily habits"><h2 class="h2" style="margin-bottom:6px">Daily habits</h2>
   ${recs.walk&&exPaused()?`<div style="padding:10px 0;border-top:1px solid var(--line2)"><b>Walking is paused</b><div class="muted sm">${h(exPaused().why)}. Reminders restart when your care team says so.</div></div>`:recs.walk?`<div style="padding:10px 0;border-top:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;gap:8px"><span>Walking this week</span><b class="nr">${walkMins()} of 150 min</b></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,Math.round(walkMins()/150*100))}%"></i></div></div>`:''}
   ${recs.salt?`<div style="padding:10px 0;border-top:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;gap:8px"><span>Salt</span><b>Under 5 g a day</b></div><div class="muted sm">About one level teaspoon, including bread and cheese.</div></div>`:''}
   ${recs.oil?`<div style="padding:10px 0;border-top:1px solid var(--line2)"><div style="display:flex;justify-content:space-between;gap:8px"><span>Fats</span><b>Olive oil instead of butter</b></div><div class="muted sm">Fewer fried and processed meats.</div></div>`:''}
   <p class="muted sm" style="margin-top:4px">Zoe suggests one or two goals at a time, never all at once.</p></section>`;
  const up=comingUp();
  const care=`<section class="card" aria-label="My care team"><h2 class="h2" style="margin-bottom:6px">My care team</h2>
   <div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)">${avatar('doc',36)}<div>Dr. Ani Petrosyan<div class="muted sm">Family medicine · decides your treatment</div></div></div>
   <div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)">${avatar('nurse',36)}<div>Narine Sargsyan<div class="muted sm">Nurse · monitor, medicines, practical help</div></div></div>
   <div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)">${orb(36)}<div>Zoe<div class="muted sm">AI assistant · daily help, never treatment decisions</div></div></div>
   ${btn('Message my care team','team',{k:'btn-navy',full:true,style:'margin-top:6px'})}</section>`;

  return `<div class="scroll" data-sk="plan">${head}${approved}${goalCard()}${explain}${meds}${bpGuide}${habits}${up}${milestoneCard()}${care}${hist}</div>`;
}
function bpSteps(){ return ['Sit quietly for 5 minutes. Back supported, feet flat, no talking.','Rest your arm on a table at heart level. Cuff on bare skin above the elbow.','Press start. Stay still until it finishes.','Take two readings, one minute apart. Enter both in the app.','Use the same arm, at the same times each day.'].map((t,i)=>`<div style="display:flex;gap:10px;padding:5px 0"><span style="flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal-l);color:var(--teal-dd);display:grid;place-items:center;font:700 12px Manrope">${i+1}</span><span>${t}</span></div>`).join(''); }

  const items=[];
  if(S.gpAppt&&S.now<at(S.gpAppt.date,S.gpAppt.time)+36e5) items.push([S.gpAppt.date,'Appointment with Dr. Ani',(S.gpAppt.type==='video'?'Video call':'In person')+' at '+S.gpAppt.time]);
  S.tests.forEach(id=>{ const b=S.book[id]; if(b&&testState(id)!=='done') items.push([b.date,TESTS[id].name,b.time+(b.mode==='home'?' · home visit':' · '+b.place)]); });
  if(S.nextBlock) items.push([S.nextBlock.start,S.nextBlock.days+'-day blood pressure check','2 morning and 2 evening readings']);

  if(S.plan&&S.plan.v===1) items.push([D(2027,1,11),'Month 3 check','Standard clinic blood pressure reading']);
  items.sort((a,b)=>a[0]-b[0]);
  return `<section class="card" aria-label="Coming up"><h2 class="h2" style="margin-bottom:6px">Coming up</h2>${items.length?items.slice(0,5).map((x,i)=>`<div class="row ${i===0?'first':''}" style="cursor:default"><span style="flex:none;width:52px;border-radius:12px;border:1px solid var(--line);text-align:center;overflow:hidden"><small style="display:block;background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:2px 0">${MO[new Date(x[0]).getMonth()].toUpperCase()}</small><b class="disp nr" style="font-size:20px;line-height:30px">${new Date(x[0]).getDate()}</b></span><div style="flex:1">${h(x[1])}<div class="muted sm">${h(WDL[new Date(x[0]).getDay()])}. ${h(x[2])}</div></div></div>`).join(''):'<p class="muted sm">Nothing booked.</p>'}<button class="btn btn-out full" data-a="openGp" style="margin-top:10px">${S.gpAppt?'Manage appointment with Dr. Ani':'Ask for an appointment with Dr. Ani'}</button></section>`;

function prePlanScreen(){

  <section class="card"><h2 class="h2">Why Zoe cannot show a plan or results yet</h2><p class="muted" style="margin-top:6px">Treatment and the meaning of your results are decided by a doctor. Zoe and the app only show them after Dr. Ani approves. If something urgent is found, your care team contacts you straight away.</p></section>

/* ============ Me ============ */

  const P=S.prefs;
  const sw=(on,a,v,label,dis)=>`<button class="switch" role="switch" aria-checked="${on}" aria-label="${h(label)}" data-a="${a}" data-v="${v}" ${dis?'disabled':''}><span><i></i></span></button>`;
  const rem=[['remMed','Medicine reminder',S.plan?effectiveMedReminder():'Starts when your plan is approved',!S.plan],['remBp','Blood pressure reminder','Only on your measuring days',false],['remHabit','Habit goal',exPaused()?'Paused until your heart check':'One gentle message a day, less over time',!S.plan]];

/* Effective date of the approved dose, distinct from reminder scheduling */
function medEffective(m){
  const hist=(S.planHistory||[]).filter(p=>p&&p.meds&&p.meds[0]&&p.v<S.plan.v); const prev=hist.length?hist[hist.length-1].meds[0]:null;
  const inForce=S.now>=m.start, d=dLong(m.start);
  let t=(inForce?'In effect since ':'Takes effect on ')+d+'.';
  if(prev&&prev.dose!==m.dose) t+=' Before that date: '+prev.name+' '+prev.dose+'. From '+dShort(m.start)+': '+m.dose+'.';
  return t+' Reminders follow this date.';
}

  const items=[
    ['Join','register','Register with your phone','you','Verified number, exact date of birth'],

    ['Get started','bpblock','Nurse visit and 7 days of home blood pressure','nurse','Narine teaches you; you measure'],
    ['Doctor decides','review','Dr. Ani reviews and decides','doc','AI prepares a draft for her. She edits and decides'],
    ['Doctor decides','consult','Consultation, only if Dr. Ani asks','doc','Video or in person. Not every client needs one'],
    ['Doctor decides','published','Treatment plan published','doc','Only after Dr. Ani approves. Reminders start now'],

    ['Review loop (every 2 to 4 weeks)','loop','Measure, review, act','nurse','Nurse removes barriers, Dr. Ani decides'],

  ];
  const stg=items.map(x=>{ const i=IDX[x[1]]; const next = items.find(y=>IDX[y[1]]>i && y!==x); return {x,i}; });
  let groups=[]; items.forEach(x=>{ let g=groups.find(y=>y.n===x[0]); if(!g){ g={n:x[0],it:[]}; groups.push(g); } g.it.push(x); });

/* ============ Review loop ============ */

  const steps=[['Collect','you','Your new 7-day readings, how you took your medicine, any symptoms and results.'],['Summarise','doc','Noreon prepares a short, evidence-linked case. AI assists the team here; you do not see drafts.'],['Fix practical barriers','nurse','Narine checks missed doses, measuring technique and device problems first.'],['Decide','doc','Dr. Ani reviews and decides: adjust, add a test, refer, or continue.'],['Update and repeat','zoe','Only an approved plan is published. Zoe then explains it.']];

   <div class="card"><div class="tl">${steps.map((s,i)=>`<div class="it"><span class="dot ${i<cur?'done':i===cur?'now':''}">${i<cur?ic('check',13,3).replace('currentColor','#fff'):i===cur?'<i style="width:8px;height:8px;border-radius:50%;background:var(--amber)"></i>':''}</span><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${i+1}. ${s[0]}</b>${actor(s[1])}</div><div class="muted sm">${s[2]}${i===cur?' <b style="color:var(--amber-d)">· now</b>':''}</div></div>`).join('')}</div></div>

}

  ${s.msg==='duplicate'?`<div role="alert" class="callout co-amber" style="margin-top:10px"><div>A reading with these numbers and this approximate time is already saved. Is this the same measurement, or a separate measurement?<div style="display:flex;gap:8px;margin-top:8px">${btn('Same measurement — keep existing','closeSheet',{sm:true})}${btn('Separate measurement — save another','logSecond',{sm:true})}</div></div></div>`:''}

  ${s.msg==='crit'?`<div role="alert" style="margin-top:10px;font-size:14.5px;padding:10px 12px;border-radius:12px;background:var(--red-l);border:1.5px solid var(--red)"><b>${s.s}/${s.d} mmHg is very high.</b> If you have ${URG_SYMP}, call 103 now. If you feel well, rest for 5 minutes and measure again.<div class="xs muted" style="margin-top:4px">Proposed demo wording. Thresholds and instructions await sign-off by the clinical team.</div></div>`:''}

}

  <div class="dtabs" role="group" aria-label="Role">${tabs.map(t=>`<button aria-pressed="${S.dirTab===t[0]}" data-a="dirTab" data-v="${t[0]}">${t[0]==='nurse'?avatar('nurse',20,'display:inline-grid;vertical-align:middle;margin-right:6px'):t[0]==='doctor'?avatar('doc',20,'display:inline-grid;vertical-align:middle;margin-right:6px'):ic('route',16)+' '}${t[1]}</button>`).join('')}</div>`;

   <button class="stg" data-a="varNoZoe" aria-pressed="${!S.consents.zoe}"><span class="n" style="${!S.consents.zoe?'background:var(--teal);color:#fff':''}">${!S.consents.zoe?'✓':''}</span><span style="flex:1">Zoe consent declined<br><span class="xs muted">Nurse-led route, no AI chat</span></span></button>

  <div class="dsec"><div class="b" style="margin-bottom:8px">Safety and care-gap demos</div><div style="display:flex;gap:6px;flex-wrap:wrap">${cbtn('Very high reading','simReading','184/121')}${cbtn('Low reading','simReading','86/54')}${cbtn('Opens help screen','emerg')}${S.plan?cbtn(S.gap14?'Undo 14-day gap':'14 days without contact','gap14'):''}</div><p class="xs muted" style="margin-top:6px">Also try typing "chest pain" or "I feel dizzy" to Zoe. Emergency words use fixed rules, not AI.</p></div>

  <div class="dsec"><div class="b" style="margin-bottom:6px">Other service rules (proposal v1)</div><ul class="xs muted" style="margin:0;padding-left:18px;display:grid;gap:3px"><li>Channels: app and SMS reminders, nurse phone calls. Only the app is shown in this prototype.</li><li>Request states: logged, accepted, attempted, awaiting the member, resolved.</li><li>Zoe consent is optional. Without it, a nurse supports the member and no AI chat is used.</li><li>Handover rule (owner to confirm): responsibility moves when the usual doctor confirms receipt. Noreon watches readings until 30 days after the month 6 visit even after an early confirmation, never after. No confirmation: +30 days, then Dr. Ani decides within 5 working days and monitoring continues until she does.</li></ul></div>
  <div class="dsec"><div class="b" style="margin-bottom:6px">Still needs a person to confirm</div><ul class="xs muted" style="margin:0;padding-left:18px;display:grid;gap:3px"><li>Clinical lead: sign-off of the thresholds, symptom list, low-reading convention and every wording above.</li><li>Privacy and legal: consent text, providers, retention period, privacy contact.</li><li>Operations: staffing for the 2 and 4 working hour windows and the overdue escalation.</li><li>Members: Armenian copy, large text, keyboard and screen reader use, human-assisted use.</li><li>No accessibility audit has been done.</li></ul></div>
  <div class="dsec"><button class="btn btn-out full sm2" data-a="stage" data-v="register">Restart from the beginning</button></div>`;
}

function nurseTab(){
  const tasks=[];
  if(S.bp.device==='scheduled') tasks.push(`<div class="dsec"><div style="display:flex;justify-content:space-between;gap:8px">${actor('nurse','Home visit')}<span class="chip s c-above">Due ${whenTxt(S.bp.visit)}</span></div><p class="sm" style="margin:8px 0">Client M. Hakobyan: demonstrate technique, pick cuff size, hand over a validated upper-arm monitor.</p>${btn('Visit done: monitor issued','nVisit',{k:'btn-navy',sm:true})}</div>`);
  if(S.bp.device==='issued'&&S.bp.practice&&!S.bp.practice.ok) tasks.push(`<div class="dsec">${actor('nurse','Supervised reading')}<p class="sm" style="margin:8px 0">Client entered ${S.bp.practice.s}/${S.bp.practice.d}. Confirm posture and technique.</p>${btn('Confirm technique correct','nConfirm',{k:'btn-navy',sm:true})}</div>`);
  else if(S.bp.device==='issued'&&!S.bp.practice) tasks.push(`<div class="dsec">${actor('nurse','Supervised reading')}<p class="sm muted" style="margin-top:8px">Waiting for the client to enter the practice reading in the app.</p></div>`);
  S.requests.filter(r=>r.status==='open'||r.status==='alerted').forEach(r=>tasks.push(`<div class="dsec"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b>${h(r.topic)}</b>${r.kind==='urgent'||r.urgent?`<span class="chip s c-crit">${S.now>r.due?'OVERDUE · ':''}URGENT by ${dShort(r.due)} ${hm(r.due)}</span>`:`<span class="chip s ${S.now>r.due?'c-crit':'c-above'}">${S.now>r.due?'OVERDUE · ':''}${(KIND[r.kind]||KIND.routine).label} by ${dShort(r.due)} ${hm(r.due)}</span>`}</div><p class="sm muted" style="margin:4px 0 8px">${h(r.text.slice(0,160))}</p>${basisHtml(r)}${r.note?`<div class="callout co-amber" style="margin-bottom:8px">${h(r.note)}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap">${btn('Call back and resolve','nResolve',{v:r.id,k:'btn-navy',sm:true})}${cbtn('Could not reach'+(r.attempts?' ('+r.attempts+'/3)':''),'nAttempt',r.id)}${(r.hist&&r.hist.length)?'<div class="xs muted" style="flex-basis:100%">Attempts: '+r.hist.map(a=>'#'+a.n+' '+a.how+' '+whenTxt(a.t)).join('; ')+'. '+(r.escalated?'Assigned to Dr. Ani. Next step: she decides (call by another route, contact person, or welfare check if urgent).':'Next attempt: '+dShort(nextWorkingDue(r.lastAttempt))+', morning.')+'</div>':''}${S.now>r.due?'<div class="xs" style="flex-basis:100%;color:var(--red-d)">Overdue: escalate to Dr. Ani and the operations lead.</div>':''}${r.status==='unreachable'?'':''}${r.fwd?'<span class="chip s c-grey">With Dr. Ani, '+(r.fwd.state==='ack'?'acknowledged':'not yet acknowledged')+'</span>':(r.to==='nurse'&&!r.urgent?cbtn('Send to Dr. Ani','nToDoc',r.id):'')}</div></div>`));
  // care gaps
  const gaps=[]; const b=S.blocks.slice().reverse()[0];
  if(b){ const m=missingCount(b); if(m) gaps.push(`${m} missing reading${m>1?'s':''} in the ${b.label.toLowerCase()}: Zoe asked about barriers. Follow up within one working day if it persists.`); }
  const skipped=Object.values(S.meds).filter(x=>x.status!=='taken').length; if(S.plan&&skipped) gaps.push(skipped+' skipped or help-flagged doses since the plan started (self-reported).');
  if(S.gap14) gaps.push('No client contact for 14 days. GP informed. Nurse call due within one working day.');
  if(S.stage==='m3'||S.stage==='m6') gaps.push((S.stage==='m3'?'Month 3':'Month 6')+' standardised clinic BP recorded: '+(S.stage==='m3'?'128/79':'126/78')+'.');
  const hd=`<div class="dsec" style="border-top:0;display:flex;gap:10px;align-items:center">${avatar('nurse',40)}<div><b>Narine Sargsyan</b><div class="xs muted">Nurse and device coordinator · demo console</div></div></div>`;
  const fb=o=>o?(o.label?o.label:o.s+'/'+o.d+(o.p?', pulse '+o.p:'')):'removed';
  const aud=(S.audit||[]).length?`<div class="dsec"><div class="b" style="margin-bottom:6px">Member corrections (audit trail)</div><ul class="sm" style="margin:0;padding-left:18px;display:grid;gap:6px">${S.audit.map(a=>`<li>${a.kind==='bp'?'Blood pressure':'Medicine'}: <b>${a.what}</b>. Was ${fb(a.from)}${a.kind==='bp'?', now '+fb(a.to):', now '+fb(a.to)}.<div class="xs muted">${a.kind==='bp'?'Measured '+whenTxt(a.measuredAt)+' · entered '+whenTxt(a.enteredAt)+' · ':''}corrected ${whenTxt(a.when)} · reason: ${h(a.reason||'')}${a.rid?' · record '+a.rid:''}</div></li>`).join('')}</ul></div>`:'';
  const fyi=S.requests.filter(r=>r.status==='fyi').map(r=>`<div class="dsec"><div style="display:flex;justify-content:space-between;gap:8px"><b>${h(r.topic)}</b><span class="chip s c-grey">For information</span></div><p class="sm muted" style="margin:4px 0 0">Help screen opened with no symptom reported. No reply is promised.</p></div>`).join('');
  return hd+nurseDash()+aud+fyi+(tasks.length?tasks.join(''):`<div class="dsec muted sm">No open nurse tasks right now. Requests appear here with a priority timer: Urgent 2 working hours, Same day 4 working hours, Routine end of next working day.</div>`)+`<div class="dsec"><div class="b" style="margin-bottom:6px">Care gaps (practical support)</div>${gaps.length?gaps.map(g=>`<div style="display:flex;gap:8px;padding:4px 0">${`<span style="color:var(--amber-d);flex:none">${ic('flag',16,2)}</span>`}<span class="sm">${g}</span></div>`).join(''):'<span class="muted sm">None.</span>'}</div>
  <div class="dsec"><div class="b" style="margin-bottom:4px">Rules the nurse works under</div><ul class="sm muted" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Missed doses, technique and device problems are checked before treatment response is judged.</li><li>Side effects or treatment questions go to the GP. Nobody changes a medicine here.</li><li>No contact for 14 days: GP informed.</li></ul></div>`;
}

function basisHtml(r){ const ids=r.rids&&r.rids.length?r.rids:(r.rid?[r.rid]:[]); if(!ids.length) return ''; const items=ids.map(id=>{ const x=S.readings.find(q=>q.id===id); const au=(S.audit||[]).filter(a=>a.rid===id); return x?'<li>'+dShort(x.t)+' '+hm(x.t)+': <b>'+x.s+'/'+x.d+'</b>'+(x.p?', pulse '+x.p:'')+(au.length?' <span class="chip s c-above">corrected '+au.length+' time'+(au.length>1?'s':'')+'</span>':'')+'</li>':'<li>'+id+': removed by the member (kept in the audit trail)</li>'; }).join(''); return `<div class="xs" style="margin:0 0 8px"><b>Basis: ${ids.length} reading${ids.length>1?'s':''}</b><ul style="margin:2px 0 0;padding-left:18px">${items}</ul></div>`; }
function docEv(t,g){ return `<span class="ev ${g?'g':''}">${t}</span>`; }

  return fbox+box+doctorTab0()+algoRefHtml()+cohortDash();

function doctorTab0(){
  const st=S.stage, idx=IDX[st];
  const hd=`<div class="dsec" style="border-top:0"><div style="display:flex;gap:10px;align-items:center">${avatar('doc',40)}<div style="flex:1"><b>Dr. Ani Petrosyan</b><div class="xs muted">Doctor portal · My clients · demo</div></div></div><div class="card" style="margin-top:10px;padding:10px 12px;display:flex;gap:10px;align-items:center"><span class="av" style="width:34px;height:34px;background:var(--navy);font-size:12px">MH</span><div style="flex:1;min-width:0"><b>Mariam Hakobyan, ${ageAt()}</b><div class="xs muted">${STAGES[idx].l}</div></div>${st==='review'||st==='consult'?'<span class="chip s c-above">Ready for review</span>':idx>=IDX.published?'<span class="chip s c-ok">Plan v'+(S.plan?S.plan.v:1)+'</span>':'<span class="chip s c-grey">Not ready</span>'}</div></div>`;

  const canApprove = S.stage!=='consult' || S.consultHeld;
  const d=S.draft;
